name: Build AI ML Coach APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "Android SDK missing"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK location: $SDK"
          ls "$SDK/platforms" || true

      - name: Find and extract source ZIP if present
        shell: bash
        run: |
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "Project already extracted in repository root"
          else
            ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
            test -n "$ZIP" || { echo "No Gradle project or ZIP at repository root"; exit 1; }
            mkdir -p extracted
            unzip -q "$ZIP" -d extracted
            PROJECT=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
            test -n "$PROJECT" || { echo "No settings.gradle found in ZIP"; exit 1; }
            echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        shell: bash
        run: |
          cd "${PROJECT_DIR:-.}"
          gradle --version
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK for phone installation
        uses: actions/upload-artifact@v4
        with:
          name: AIML-Coach-Android-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
