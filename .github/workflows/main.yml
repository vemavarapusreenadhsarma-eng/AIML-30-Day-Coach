name: Build Premium AI ML Coach APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Find premium project
        shell: bash
        run: |
          if [ -f settings.gradle ]; then
            echo 'PROJECT_DIR=.' >> "$GITHUB_ENV"
          else
            ZIP=$(find . -maxdepth 1 -type f -name 'AIML_Coach_Premium_Compose_Source.zip' -print -quit)
            if [ -z "$ZIP" ]; then
              echo 'Upload AIML_Coach_Premium_Compose_Source.zip to repository root.'
              exit 1
            fi
            mkdir -p extracted
            unzip -q "$ZIP" -d extracted
            echo 'PROJECT_DIR=extracted/AIML_Coach_Premium_Compose' >> "$GITHUB_ENV"
          fi
      - name: Configure Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || exit 1
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIML-Coach-Premium-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
