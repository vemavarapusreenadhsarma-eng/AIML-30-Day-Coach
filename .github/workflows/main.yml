
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      -       - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "Android SDK: $ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT"

      - name: Extract Android project
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "No ZIP file found"
            exit 1
          fi
          unzip -q "$ZIP" -d extracted

      - name: Build APK
        run: |
          PROJECT=$(find extracted -name settings.gradle -print -quit)
          if [ -z "$PROJECT" ]; then
            PROJECT=$(find extracted -name settings.gradle.kts -print -quit)
          fi
          if [ -z "$PROJECT" ]; then
            echo "Android Gradle project not found"
            exit 1
          fi
          cd "$(dirname "$PROJECT")"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIML-Coach-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
